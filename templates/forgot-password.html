<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MoviPilot | Forgot Password</title>

    <link
        rel="icon"
        href="/img/logo favicon.png"
    >

    <link
        rel="stylesheet"
        href="/templates/css/forgot-password.css?v=1"
    >

</head>


<body>


    <!-- ==================================================
         FORGOT PASSWORD PAGE
    =================================================== -->

    <main class="recovery-page">


        <!-- ==================================================
             ANIMATED BACKGROUND
        =================================================== -->

        <div class="home-background">

            <div class="ambient-glow glow-one"></div>

            <div class="ambient-glow glow-two"></div>

            <div class="ambient-glow glow-three"></div>


            <canvas id="particleCanvas"></canvas>


            <div class="light-streak streak-one"></div>

            <div class="light-streak streak-two"></div>


            <div class="cinematic-overlay"></div>

        </div>



        <!-- ==================================================
             RECOVERY CARD
        =================================================== -->

        <section class="recovery-card">


            <!-- ==================================================
                 LOGO
            =================================================== -->

            <a
                href="/homepage"
                class="recovery-logo"
            >

                <img
                    src="/img/logo favicon.png"
                    alt="MoviPilot logo"
                >

                <span>
                    Movi<span>Pilot</span>
                </span>

            </a>



            <!-- ==================================================
                 HEADER
            =================================================== -->

            <div class="recovery-header">

                <div class="recovery-icon">

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path
                            d="M4 7.5C4 6.39543 4.89543 5.5 6 5.5H18C19.1046 5.5 20 6.39543 20 7.5V16.5C20 17.6046 19.1046 18.5 18 18.5H6C4.89543 18.5 4 17.6046 4 16.5V7.5Z"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />

                        <path
                            d="M5 7L12 12.5L19 7"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </div>


                <span class="recovery-eyebrow">
                    ACCOUNT RECOVERY
                </span>


                <h1>
                    Forgot your password?
                </h1>


                <p>
                     Enter the email address associated
       with your MoviPilot account. We'll
       send you a secure reset link.
                </p>

            </div>



            <!-- ==================================================
                 FORM
            =================================================== -->

            <form
                action="/forgot-password"
                method="POST"
                id="forgotPasswordForm"
            >


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email address
                    </label>


                    <div class="input-wrapper">


                        <!-- Email Icon -->

                        <svg
                            class="input-icon"
                            viewBox="0 0 24 24"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                            aria-hidden="true"
                        >

                            <rect
                                x="3.5"
                                y="5.5"
                                width="17"
                                height="13"
                                rx="2"
                                stroke="currentColor"
                                stroke-width="1.6"
                            />

                            <path
                                d="M4.5 7L12 12.5L19.5 7"
                                stroke="currentColor"
                                stroke-width="1.6"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />

                        </svg>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- SUBMIT -->

                <button
                    type="submit"
                    class="reset-button"
                >

                    <span>
                        Send reset link
                    </span>


                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path
                            d="M5 12H19"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                        />

                        <path
                            d="M13 6L19 12L13 18"
                            stroke="currentColor"
                            stroke-width="1.8"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                    </svg>

                </button>

            </form>



            <!-- ==================================================
                 BACK TO LOGIN
            =================================================== -->

            <a
                href="/login"
                class="back-login"
            >

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >

                    <path
                        d="M19 12H5"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                    />

                    <path
                        d="M11 6L5 12L11 18"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />

                </svg>


                <span>
                    Back to login
                </span>

            </a>



            <!-- ==================================================
                 SECURITY NOTE
            =================================================== -->

            <div class="security-note">

                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >

                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="10"
                        rx="2"
                        stroke="currentColor"
                        stroke-width="1.5"
                    />

                    <path
                        d="M8 10V7.5C8 5.29086 9.79086 3.5 12 3.5C14.2091 3.5 16 5.29086 16 7.5V10"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                    />

                </svg>


                <span>
                    Your account security is our priority.
                </span>

            </div>


        </section>


    </main>



    <!-- ==================================================
         BACKGROUND JAVASCRIPT
    =================================================== -->

    <script src="/templates/js/homepage_bg.js"></script>


</body>
</html>
