<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviPilot | Reset Password</title>
    <link rel="icon" href="/img/logo favicon.png">
    <link rel="stylesheet" href="/templates/css/reset-password.css?v=1">
</head>
<body>
    <div class="home-background">
        <div class="ambient-glow glow-one"></div>
        <div class="ambient-glow glow-two"></div>
        <div class="ambient-glow glow-three"></div>
        <canvas id="particleCanvas"></canvas>
        <div class="light-streak streak-one"></div>
        <div class="light-streak streak-two"></div>
        <div class="cinematic-overlay"></div>
    </div>

    <main class="reset-page">
        <section class="reset-card">
            <a href="/homepage" class="reset-brand">
                <img src="/img/logo favicon.png" alt="MoviPilot">
                <span>Movi<span>Pilot</span></span>
            </a>

            <div class="reset-header">
                <div class="reset-icon" aria-hidden="true">
                    <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="15" y="28" width="34" height="25" rx="7" class="lock-body" />
                        <path d="M22 28V22C22 16.477 26.477 12 32 12C37.523 12 42 16.477 42 22V28" class="lock-shackle" />
                        <circle cx="32" cy="40" r="3" class="lock-dot" />
                        <path d="M32 43V47" class="lock-line" />
                    </svg>
                </div>

                <span class="reset-eyebrow">ACCOUNT RECOVERY</span>
                <h1>Create a new password</h1>
                <p>
                    Choose a new password for your MoviPilot account.
                    Your new password will replace the old one.
                </p>
            </div>

            <div class="reset-email">
                <span class="email-label">ACCOUNT</span>
                <strong>{{ .Email }}</strong>
            </div>

            <form action="/reset-password" method="POST" id="resetPasswordForm" novalidate>
                <div class="field-group">
                    <label for="newPassword">New password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="newPassword"
                            name="password"
                            autocomplete="new-password"
                            placeholder="Enter your new password"
                            maxlength="128"
                        >

                        <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M2.5 12C4.7 8.3 8.1 6.2 12 6.2C15.9 6.2 19.3 8.3 21.5 12C19.3 15.7 15.9 17.8 12 17.8C8.1 17.8 4.7 15.7 2.5 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
                            </svg>

                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                                <path d="M10.4 6.5C10.92 6.3 11.45 6.2 12 6.2C15.9 6.2 19.3 8.3 21.5 12C20.62 13.48 19.53 14.69 18.28 15.61" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                                <path d="M6.1 7.6C4.68 8.55 3.48 9.99 2.5 12C4.7 15.7 8.1 17.8 12 17.8C13.02 17.8 14 17.65 14.92 17.37" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                            </svg>
                        </button>
                    </div>

                    <p class="field-error" id="passwordError" role="alert"></p>
                </div>

                <div class="field-group">
                    <label for="confirmPassword">Confirm password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            autocomplete="new-password"
                            placeholder="Re-enter your new password"
                            maxlength="128"
                        >

                        <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password">
                            <svg class="eye-open" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M2.5 12C4.7 8.3 8.1 6.2 12 6.2C15.9 6.2 19.3 8.3 21.5 12C19.3 15.7 15.9 17.8 12 17.8C8.1 17.8 4.7 15.7 2.5 12Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7" />
                            </svg>

                            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M3 3L21 21" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                                <path d="M10.4 6.5C10.92 6.3 11.45 6.2 12 6.2C15.9 6.2 19.3 8.3 21.5 12C20.62 13.48 19.53 14.69 18.28 15.61" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                                <path d="M6.1 7.6C4.68 8.55 3.48 9.99 2.5 12C4.7 15.7 8.1 17.8 12 17.8C13.02 17.8 14 17.65 14.92 17.37" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
                            </svg>
                        </button>
                    </div>

                    <p class="field-error" id="confirmPasswordError" role="alert"></p>
                </div>

                <div class="password-hint">
                    <span class="hint-dot"></span>
                    <span>At least 8 characters, including one letter and one number.</span>
                </div>

                <button type="submit" class="reset-button" id="resetButton">
                    <span class="reset-button-text">Reset password</span>
                    <span class="reset-button-loader" aria-hidden="true"></span>
                    <svg class="reset-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M5 12H19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                        <path d="M13 6L19 12L13 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </button>
            </form>

            <a href="/login" class="back-login">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M19 12H5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M11 18L5 12L11 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Back to login
            </a>

            <div class="security-note">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 3L19 6V11.5C19 16.2 16.1 20.2 12 21C7.9 20.2 5 16.2 5 11.5V6L12 3Z" stroke="currentColor" stroke-width="1.5" />
                    <path d="M9.5 12L11.2 13.7L14.8 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                <span>Your new password is protected with secure hashing.</span>
            </div>
        </section>
    </main>

    <script src="/templates/js/homepage_bg.js"></script>
    <script src="/templates/js/reset-password.js"></script>
</body>
</html>
