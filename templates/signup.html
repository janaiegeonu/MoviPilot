<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoviPilot/signup</title>
    <link rel="icon" type="image/png" href="templates/logo favicon.png">
    <link rel="stylesheet" href="templates/css/signup.css?v=1">
</head>
<body>

    <form action="/signup" method="post">
        <div class="module-container">
            <!-- White card panel for your future inputs -->
            <div class="module-card">
                <!-- Add your signup form fields/inputs here -->
            </div>
            
            <!-- Sliding Image Banner Panel -->
            <div class="module-cardimg">
                <!-- Sliding Image Layers -->
                <div class="card-slide img-1"></div>
                <div class="card-slide img-2"></div>
                <div class="card-slide img-3"></div>
                
                <!-- Darkened gradient visual layout shield -->
                <div class="card-overlay"></div>
                
                <!-- Overlaid Static Foreground Info -->
                <div class="card-content">
                    <h1>MoviPilot</h1>
                    <p>Discover something amazing today.</p>
                </div>
            </div>
        </div>
    </form>
  
</body>
</html>
