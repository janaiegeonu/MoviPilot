<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>MoviPilot/Signup</title>
    <link rel="icon" type="image/png" href="img/logo favicon.png">
    <link rel="stylesheet" href="templates/css/signup.css?v=1">
</head>
<body>

 <!-- =========================================
         SIGNUP PAGE
    ========================================== -->

    <div class="signup-page">


        <!-- Animated background -->

        <div class="home-background">

            <div class="ambient-glow glow-one"></div>

            <div class="ambient-glow glow-two"></div>

            <div class="ambient-glow glow-three"></div>

            <canvas id="particleCanvas"></canvas>

            <div class="light-streak streak-one"></div>

            <div class="light-streak streak-two"></div>

            <div class="cinematic-overlay"></div>

        </div>



        <!-- =====================================
             SIGNUP CARD
        ====================================== -->

        <main class="signup-container">


            <!-- LEFT SIDE -->

            <section class="showcase-panel">

              <div class="showcase-image">

    <div class="module-cardimg">

        <!-- ==============================
             SLIDE 1
        =============================== -->

        <div class="card-slide img-1">

            <img
                src="/img/ANIME_4K.jpg"
                alt="Anime"
            >

            <div class="slide-shade"></div>

            <div class="genre-label">
                ANIME
            </div>

        </div>


        <!-- ==============================
             SLIDE 2
        =============================== -->

        <div class="card-slide img-2">

            <img
                src="/img/ACTION_4K.png"
                alt="Action"
            >

            <div class="slide-shade"></div>

            <div class="genre-label">
                ACTION
            </div>

        </div>


        <!-- ==============================
             SLIDE 3
        =============================== -->

        <div class="card-slide img-3">

            <img
                src="/img/ROMANCE_4K.png"
                alt="Romance"
            >

            <div class="slide-shade"></div>

            <div class="genre-label">
                ROMANCE
            </div>

        </div>

    </div>

</div>

                <div class="showcase-overlay"></div>


                <div class="showcase-content">

                    <div class="showcase-logo">

                        <div class="logo-placeholder">
                            <img src="/img/logo favicon.png">
                        </div>

                     <span>Movi<span class="brand-accent">Pilot</span></span>

                    </div>


                    <div class="showcase-text">

                        <span class="showcase-label">
                            YOUR MOVIE COMPASS
                        </span>

                        <h1>
                            Discover Premium
                            <br>
                            Movies effortlessly.
                        </h1>

                        <p>
                            Explore movies, discover new favorites
                            and let MoviPilot guide your next watch.
                        </p>

                    </div>

                </div>


                <div class="showcase-line"></div>

            </section>



            <!-- RIGHT SIDE -->

            <section class="form-panel">

                <div class="form-wrapper">


                    <div class="form-header">

                        <span class="form-eyebrow">
                            WELCOME TO MOVIPILOT
                        </span>

                        <h2>
                            Create your account
                        </h2>

                        <p>
                           Your personal guide to better movies.
                        </p>

                    </div>



                    <form
                        class="signup-form"
                        id="signupForm"
                        action="/signup"
                        method="POST"
                    >


                        <!-- FULL NAME -->

                        <div class="input-group">

                            <label for="fullname">
                                Full Name
                            </label>

                            <div class="input-wrapper">

                                <span class="input-icon">
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                    >
                                        <path
                                            d="M20 21C20 17.6863 17.3137 15 14 15H10C6.68629 15 4 17.6863 4 21"
                                            stroke="currentColor"
                                            stroke-width="1.6"
                                            stroke-linecap="round"
                                        />

                                        <circle
                                            cx="12"
                                            cy="7"
                                            r="4"
                                            stroke="currentColor"
                                            stroke-width="1.6"
                                        />
                                    </svg>
                                </span>

                                <input
                                    type="text"
                                    id="fullname"
                                    name="fullname"
                                    placeholder="Enter your full name"
                                    autocomplete="name"
                                    required
                                >

                            </div>

                        </div>



                        <!-- EMAIL -->

                        <div class="input-group">

                            <label for="email">
                                Email Address
                            </label>

                            <div class="input-wrapper">

                                <span class="input-icon">
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                    >
                                        <rect
                                            x="3"
                                            y="5"
                                            width="18"
                                            height="14"
                                            rx="2"
                                            stroke="currentColor"
                                            stroke-width="1.6"
                                        />

                                        <path
                                            d="M3 7L12 13L21 7"
                                            stroke="currentColor"
                                            stroke-width="1.6"
                                            stroke-linecap="round"
                                            stroke-linejoin="round"
                                        />
                                    </svg>
                                </span>

                                <input
                                    type="email"
                                    id="email"
                                    name="email"
                                    placeholder="you@example.com"
                                    autocomplete="email"
                                    required
                                >

                            </div>

                        </div>



                        <!-- PASSWORD -->

                        <div class="input-group">

                            <label for="password">
                                Password
                            </label>

                            <div class="input-wrapper">

                                <span class="input-icon">
                                    <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        xmlns="http://www.w3.org/2000/svg"
                                    >
                                        <rect
                                            x="4"
                                            y="10"
                                            width="16"
                                            height="11"
                                            rx="2"
                                            stroke="currentColor"
                                            stroke-width="1.6"
                                        />

                                        <path
                                            d="M8 10V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V10"
                                            stroke="currentColor"
                                            stroke-width="1.6"
                                            stroke-linecap="round"
                                        />

                                    </svg>
                                </span>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Create a password"
                                    autocomplete="new-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-target="password"
                                    aria-label="Show password"
                                >
                                    👁
                                </button>

                            </div>

                        </div>



                        <!-- CONFIRM PASSWORD -->

                        <div class="input-group">

                            <label for="confirmPassword">
                                Confirm Password
                            </label>

                            <div class="input-wrapper">

                                <span class="input-icon">
                                  <svg
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        xmlns="http://www.w3.org/2000/svg"
                                    >
                                        <rect
                                            x="4"
                                            y="10"
                                            width="16"
                                            height="11"
                                            rx="2"
                                            stroke="currentColor"
                                            stroke-width="1.6"
                                        />

                                        <path
                                            d="M8 10V7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7V10"
                                            stroke="currentColor"
                                            stroke-width="1.6"
                                            stroke-linecap="round"
                                        />

                                    </svg>
                                </span>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Repeat your password"
                                    autocomplete="new-password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="password-toggle"
                                    data-target="confirmPassword"
                                    aria-label="Show password"
                                >
                                    👁
                                </button>

                            </div>

                        </div>



                        <!-- TERMS -->

                        <label class="terms">

                            <input
                                type="checkbox"
                                name="terms"
                                required
                            >

                            <span class="custom-checkbox"></span>

                            <span class="terms-text">

                                I agree to the
                                <a href="#">
                                    Terms of Service
                                </a>

                                and

                                <a href="#">
                                    Privacy Policy
                                </a>

                            </span>

                        </label>



                        <!-- CREATE ACCOUNT -->

                        <button
                            type="submit"
                            class="create-account-btn"
                        >

                            <span>
                                Create Account
                            </span>

                            <span class="button-arrow">
                                →
                            </span>

                        </button>

                    </form>



                    <!-- GOOGLE -->

                    <div class="alternative-signup">

                        <div class="or-divider">

                            <span></span>

                            <p>OR</p>

                            <span></span>

                        </div>


                        <button
                            type="button"
                            class="google-btn"
                            id="googleSignup"
                        >

                            <span class="google-icon">
                               <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><g id="SVGRepo_bgCarrier" stroke-width="0"></g>
                                <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M30.0014 16.3109C30.0014 15.1598 29.9061 14.3198 29.6998 13.4487H16.2871V18.6442H24.1601C24.0014 19.9354 23.1442 21.8798 21.2394 23.1864L21.2127 23.3604L25.4536 26.58L25.7474 26.6087C28.4458 24.1665 30.0014 20.5731 30.0014 16.3109Z" fill="#4285F4">

                                </path> <path d="M16.2863 29.9998C20.1434 29.9998 23.3814 28.7553 25.7466 26.6086L21.2386 23.1863C20.0323 24.0108 18.4132 24.5863 16.2863 24.5863C12.5086 24.5863 9.30225 22.1441 8.15929 18.7686L7.99176 18.7825L3.58208 22.127L3.52441 22.2841C5.87359 26.8574 10.699 29.9998 16.2863 29.9998Z" fill="#34A853">

                                </path> <path d="M8.15964 18.769C7.85806 17.8979 7.68352 16.9645 7.68352 16.0001C7.68352 15.0356 7.85806 14.1023 8.14377 13.2312L8.13578 13.0456L3.67083 9.64746L3.52475 9.71556C2.55654 11.6134 2.00098 13.7445 2.00098 16.0001C2.00098 18.2556 2.55654 20.3867 3.52475 22.2845L8.15964 18.769Z" fill="#FBBC05"></path> <path d="M16.2864 7.4133C18.9689 7.4133 20.7784 8.54885 21.8102 9.4978L25.8419 5.64C23.3658 3.38445 20.1435 2 16.2864 2C10.699 2 5.8736 5.1422 3.52441 9.71549L8.14345 13.2311C9.30229 9.85555 12.5086 7.4133 16.2864 7.4133Z" fill="#EB4335">
                                    
                                </path> </g></svg>
                            </span>

                            <span>
                                Continue with Google
                            </span>

                        </button>

                    </div>



                    <!-- LOGIN -->

                    <div class="login-prompt">

                        <span>
                            Already have an account?
                        </span>

                        <a href="/login">
                            Login
                        </a>

                    </div>


                </div>

            </section>


        </main>

    </div>


    <!-- ONLY SIGNUP JAVASCRIPT -->

    <script src="/templates/js/signup.js"></script>

    
</body>
</html>
